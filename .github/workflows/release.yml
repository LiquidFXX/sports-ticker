name: Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/sports_ticker/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path('custom_components/sports_ticker/manifest.json').read_text()
          )
          print(manifest['version'])
          PY
          )"

          if [[ "$manifest_version" == *-* ]]; then
            prerelease="true"
          else
            prerelease="false"
          fi

          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$manifest_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build HACS release ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd custom_components/sports_ticker
          zip -r ../../sports_ticker.zip . \
            -x "__pycache__/*" "*.pyc" "*.pyo"

      - name: Verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f sports_ticker.zip
          unzip -t sports_ticker.zip
          unzip -l sports_ticker.zip

      - name: Create release or upload asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" sports_ticker.zip --clobber
          else
            release_args=(
              "$RELEASE_TAG"
              sports_ticker.zip
              --target "$GITHUB_SHA"
              --title "$RELEASE_TAG"
              --generate-notes
            )

            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              release_args+=(--prerelease)
            fi

            gh release create "${release_args[@]}"
          fi
