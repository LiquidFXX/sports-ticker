name: Add NFL dashboard data once

on:
  push:
    paths:
      - '.github/workflows/nfl-dashboard-data-once.yml'
      - 'scripts/nfl_dashboard_data_patch_once.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Apply data enhancements
        run: python scripts/nfl_dashboard_data_patch_once.py

      - name: Compile integration
        run: python -m compileall -q custom_components/sports_ticker

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Commit validated update
        shell: bash
        run: |
          git diff --check
          rm -f scripts/nfl_dashboard_data_patch_once.py
          rm -f .github/workflows/nfl-dashboard-data-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Expose NFL season dashboard and recent form data'
          git push origin HEAD:main
