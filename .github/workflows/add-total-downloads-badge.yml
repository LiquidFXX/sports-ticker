name: Add total downloads badge

on:
  push:
    paths:
      - ".github/workflows/add-total-downloads-badge.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add lifetime downloads badge
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          badge = "[![Total Downloads](https://img.shields.io/github/downloads/LiquidFXX/sports-ticker/total?label=Total%20Downloads)](https://github.com/LiquidFXX/sports-ticker/releases)"
          paypal = "[![PayPal](https://img.shields.io/badge/PayPal-Support%20Me-00457C?logo=paypal&logoColor=white)](https://www.paypal.com/paypalme/KevinHughesPhoto)"

          if badge not in text:
              text = text.replace(paypal, paypal + "\n" + badge, 1)
              path.write_text(text)

      - name: Commit README and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-total-downloads-badge.yml
          git add README.md
          git commit -m "Add lifetime downloads badge"
          git push
