name: Tests

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile integration Python
        run: python -m compileall -q custom_components/sports_ticker

      - name: Check bundled card JavaScript syntax
        run: |
          node --check custom_components/sports_ticker/frontend/sports-ticker-card-v2.js
          node --check custom_components/sports_ticker/frontend/sports-ticker-card-editor-v4.js

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
