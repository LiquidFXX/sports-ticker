name: Feature Tests

on:
  push:
    branches:
      - feature/multi-sport-data-platform

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile integration Python
        run: python -m compileall -q custom_components/sports_ticker

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
