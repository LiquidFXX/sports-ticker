type: custom:button-card
entity: sensor.espn_cfb_scoreboard_raw
show_name: false
show_icon: false
show_state: false
triggers_update:
  - sensor.espn_cfb_scoreboard_raw

variables:
  src: sensor.espn_cfb_scoreboard_raw

styles:
  card:
    - border-radius: 16px
    - overflow: hidden
    - padding: 0
    - background: rgba(255,255,255,0.96)
    - border: 1px solid rgba(0,0,0,0.10)
    - box-shadow: 0 10px 22px rgba(0,0,0,0.16)

  grid:
    - grid-template-areas: '"main"'
    - grid-template-columns: 1fr
    - grid-template-rows: 1fr

  custom_fields:
    main:
      - width: 100%

custom_fields:
  main: |
    [[[
      const st = states[variables.src];
      const events = st?.attributes?.events || [];
      const fav = String(st?.attributes?.favorite_team || '').toUpperCase();

      const configuredSpeed = Number(st?.attributes?.ticker_speed);
      const scrollDuration =
        Number.isFinite(configuredSpeed) && configuredSpeed > 0
          ? configuredSpeed * 3
          : 36;

      const getComp = e => e?.competitions?.[0] || {};
      const getStatusType = e => getComp(e)?.status?.type || e?.status?.type || {};
      const getState = e => getStatusType(e)?.state || 'pre';
      const getDetail = e => getStatusType(e)?.shortDetail || getStatusType(e)?.detail || 'Scheduled';

      const teamBySide = (comp, side) =>
        (comp?.competitors || []).find(t => t.homeAway === side) || null;

      const logo = team =>
        team?.team?.logo ||
        team?.team?.logos?.[0]?.href ||
        team?.team?.logos?.[0]?.url ||
        '';

      const score = team => team?.score ?? '';

      const parseNum = value => {
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
      };

      const timeText = event => {
        const date = event?.date || getComp(event)?.date;
        if (!date) return 'TBD';
        return new Date(date).toLocaleTimeString([], {
          hour: 'numeric',
          minute: '2-digit'
        });
      };

      if (!events.length) {
        return `
          <div class="ticker-shell" style="--ticker-duration:${scrollDuration}s;">
            <div class="ticker-track static">
              <div class="ticker-tile">
                <div class="ticker-top">
                  <span class="pill muted">NO GAMES</span>
                  <span class="pill meta">CFB</span>
                </div>
                <div class="ticker-row single">No college football games found</div>
              </div>
            </div>
          </div>
        `;
      }

      const sorted = [...events].sort((a, b) => {
        const aComp = getComp(a);
        const bComp = getComp(b);

        const aFav = (aComp.competitors || []).some(
          team => String(team.team?.abbreviation || '').toUpperCase() === fav
        );
        const bFav = (bComp.competitors || []).some(
          team => String(team.team?.abbreviation || '').toUpperCase() === fav
        );

        if (aFav !== bFav) return aFav ? -1 : 1;

        const rank = { in: 0, pre: 1, post: 2 };
        const aRank = rank[getState(a)] ?? 9;
        const bRank = rank[getState(b)] ?? 9;

        if (aRank !== bRank) return aRank - bRank;
        return String(a?.date || '').localeCompare(String(b?.date || ''));
      });

      const tiles = sorted
        .map(event => {
          const comp = getComp(event);
          const away = teamBySide(comp, 'away');
          const home = teamBySide(comp, 'home');

          if (!away || !home) return '';

          const state = getState(event);
          const detail = getDetail(event);
          const awayAbbr = away.team?.abbreviation || 'AWY';
          const homeAbbr = home.team?.abbreviation || 'HME';
          const awayScore = score(away);
          const homeScore = score(home);

          const awayNumber = parseNum(awayScore);
          const homeNumber = parseNum(homeScore);
          const showScores = state !== 'pre';

          const awayLead = showScores && awayNumber > homeNumber;
          const homeLead = showScores && homeNumber > awayNumber;

          const badge =
            state === 'in'
              ? `<span class="pill live">LIVE</span><span class="pill meta">${detail}</span>`
              : state === 'post'
                ? `<span class="pill final">FINAL</span><span class="pill meta">${detail}</span>`
                : `<span class="pill muted">UPCOMING</span><span class="pill meta">${timeText(event)}</span>`;

          return `
            <div class="ticker-tile">
              <div class="ticker-top">${badge}</div>

              <div class="ticker-row">
                <span class="win-dot ${awayLead ? 'on' : ''}"></span>
                ${logo(away) ? `<img class="team-logo" src="${logo(away)}">` : ''}
                <span class="team-abbr">${awayAbbr}</span>
                <span class="team-score">${showScores ? awayScore : ''}</span>
              </div>

              <div class="ticker-row">
                <span class="win-dot ${homeLead ? 'on' : ''}"></span>
                ${logo(home) ? `<img class="team-logo" src="${logo(home)}">` : ''}
                <span class="team-abbr">${homeAbbr}</span>
                <span class="team-score">${showScores ? homeScore : ''}</span>
              </div>
            </div>
          `;
        })
        .filter(Boolean)
        .join('<div class="sep"></div>');

      return `
        <div class="ticker-shell" style="--ticker-duration:${scrollDuration}s; --tile-count:${events.length};">
          <div class="ticker-mask">
            <div class="ticker-track">
              ${tiles}
            </div>
          </div>
        </div>
      `;
    ]]]

card_mod:
  style: |
    .ticker-shell {
      width: 100%;
      height: clamp(56px, 6vw, 90px);
      display: flex;
      align-items: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(241,243,246,0.98));
      font-size: clamp(10px, 1.2vw, 14px);
    }

    .ticker-mask {
      width: 100%;
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, black 7%, black 93%, transparent 100%);
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      padding-left: 100%;
      animation: cfb-marquee calc(var(--ticker-duration, 36s) * (var(--tile-count, 6) / 6)) linear infinite;
    }

    .ticker-track.static {
      width: 100%;
      padding-left: 0;
      justify-content: center;
      animation: none;
    }

    @keyframes cfb-marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .ticker-tile {
      min-width: clamp(160px, 18vw, 260px);
      padding: clamp(6px, 0.8vw, 12px) clamp(10px, 1vw, 16px);
      display: flex;
      flex-direction: column;
      gap: clamp(3px, 0.4vw, 6px);
    }

    .sep {
      height: clamp(36px, 4vw, 56px);
      border-right: 1px solid rgba(0,0,0,0.11);
    }

    .ticker-top {
      display: flex;
      gap: 6px;
    }

    .pill {
      font-size: clamp(9px, 0.9vw, 11px);
      font-weight: 900;
      padding: clamp(2px, 0.4vw, 4px) clamp(6px, 0.8vw, 10px);
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.88);
    }

    .pill.live { background: rgba(215,0,0,0.95); color: #fff; }
    .pill.final { background: rgba(20,20,20,0.88); color: #fff; }

    .ticker-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .team-logo {
      width: clamp(16px, 1.6vw, 24px);
      height: clamp(16px, 1.6vw, 24px);
    }

    .team-abbr {
      min-width: clamp(30px, 3vw, 44px);
      font-size: 1em;
      font-weight: 900;
    }

    .team-score {
      margin-left: auto;
      font-size: 1em;
      font-weight: 900;
    }

    .win-dot {
      width: clamp(6px, 0.6vw, 10px);
      height: clamp(6px, 0.6vw, 10px);
      border-radius: 50%;
      background: rgba(0,0,0,0.12);
    }

    .win-dot.on {
      background: #2ecc71;
    }
