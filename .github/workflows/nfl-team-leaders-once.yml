name: Apply NFL Team Leaders Integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nfl-team-leaders-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch coordinator and README
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/sports_ticker/coordinator.py')
          text = path.read_text()

          import_anchor = ')\n\n_LOGGER = logging.getLogger(__name__)'
          import_block = ''' )\n'''
          # Keep exact formatting of the existing const import closing paren.
          replacement = ''')\n\nfrom .nfl_team_leaders import (\n    NFL_SUMMARY_URL,\n    empty_team_leaders,\n    get_event_team_leaders,\n    merge_nfl_team_leaders,\n    team_leaders_have_data,\n)\n\n_LOGGER = logging.getLogger(__name__)'''
          if 'from .nfl_team_leaders import (' not in text:
              if import_anchor not in text:
                  raise SystemExit('Could not find coordinator import anchor')
              text = text.replace(import_anchor, replacement, 1)

          validation_anchor = '''                if not self._is_valid_scoreboard_payload(payload):\n                    raise ValueError(f"Invalid ESPN payload for {league}")\n\n                now = dt_util.utcnow().isoformat()'''
          validation_replacement = '''                if not self._is_valid_scoreboard_payload(payload):\n                    raise ValueError(f"Invalid ESPN payload for {league}")\n\n                if league == "nfl":\n                    await self._enrich_nfl_team_leaders(payload, previous)\n\n                now = dt_util.utcnow().isoformat()'''
          if 'await self._enrich_nfl_team_leaders(payload, previous)' not in text:
              if validation_anchor not in text:
                  raise SystemExit('Could not find scoreboard validation anchor')
              text = text.replace(validation_anchor, validation_replacement, 1)

          method_anchor = '''    async def _fetch_mlb_player_leaders(\n        self,\n        previous: dict[str, Any] | None = None,\n    ) -> dict[str, Any]:'''
          method = '''    async def _enrich_nfl_team_leaders(\n        self,\n        payload: dict[str, Any],\n        previous: dict[str, Any] | None = None,\n    ) -> None:\n        """Enrich NFL scoreboard events with away/home box-score leaders."""\n        events = payload.get("events")\n        if not isinstance(events, list):\n            return\n\n        previous_events: dict[str, dict[str, Any]] = {}\n        if isinstance(previous, dict):\n            cached_events = previous.get("events")\n            if isinstance(cached_events, list):\n                previous_events = {\n                    str(event.get("id")): event\n                    for event in cached_events\n                    if isinstance(event, dict) and event.get("id") is not None\n                }\n\n        for event in events:\n            if not isinstance(event, dict):\n                continue\n\n            competitions = event.get("competitions")\n            if not isinstance(competitions, list) or not competitions:\n                continue\n            competition = competitions[0]\n            if not isinstance(competition, dict):\n                continue\n\n            # Always expose a predictable structure, including scheduled games.\n            competition["team_leaders"] = empty_team_leaders()\n\n            event_id = str(event.get("id") or "").strip()\n            if not event_id:\n                continue\n\n            status = event.get("status")\n            if not isinstance(status, dict):\n                status = competition.get("status")\n            status_type = status.get("type") if isinstance(status, dict) else {}\n            state = (\n                str(status_type.get("state") or "").lower()\n                if isinstance(status_type, dict)\n                else ""\n            )\n\n            cached = get_event_team_leaders(previous_events.get(event_id))\n\n            # Future games do not have meaningful box-score leaders yet.\n            if state == "pre":\n                continue\n\n            # Final games are immutable; reuse the persisted enriched payload.\n            if state == "post" and team_leaders_have_data(cached):\n                competition["team_leaders"] = cached\n                continue\n\n            try:\n                summary = await self._fetch_json(\n                    NFL_SUMMARY_URL.format(event_id=event_id)\n                )\n                merge_nfl_team_leaders(event, summary)\n            except Exception as err:\n                # A failed summary must never blank the whole NFL scoreboard.\n                if team_leaders_have_data(cached):\n                    competition["team_leaders"] = cached\n                _LOGGER.warning(\n                    "Failed to update NFL team leaders for event %s. Error: %s",\n                    event_id,\n                    err,\n                )\n\n'''
          if 'async def _enrich_nfl_team_leaders(' not in text:
              if method_anchor not in text:
                  raise SystemExit('Could not find MLB method anchor')
              text = text.replace(method_anchor, method + method_anchor, 1)

          path.write_text(text)

          readme = Path('README.md')
          doc = readme.read_text()
          doc_anchor = '''The `cfp` list can be empty early in the season before the College Football Playoff committee publishes its first rankings. `ap_top_25` and `coaches_poll` are populated whenever ESPN provides those polls.\n\n### Main scoreboard attributes'''
          doc_block = '''The `cfp` list can be empty early in the season before the College Football Playoff committee publishes its first rankings. `ap_top_25` and `coaches_poll` are populated whenever ESPN provides those polls.\n\n### NFL per-team game leaders\n\nNFL scoreboard events now keep ESPN's existing competition-level `leaders` array and also add normalized away/home leaders from the game's ESPN summary box score. This is designed for side-by-side GAME LEADERS cards.\n\n```yaml\nevents:\n  - id: "401873286"\n    competitions:\n      - leaders: []  # Existing ESPN leaders are unchanged\n        team_leaders:\n          away:\n            passing:\n              name: Aidan O'Connell\n              short_name: A. O'Connell\n              position: QB\n              headshot: https://...\n              value: 166\n              detail: 15/24 CMP/ATT\n              team_id: "13"\n              team_abbreviation: LV\n            rushing: {}\n            receiving: {}\n            sacks: {}\n            tackles: {}\n          home:\n            passing: {}\n            rushing: {}\n            receiving: {}\n            sacks: {}\n            tackles: {}\n```\n\nThe five normalized categories are `passing`, `rushing`, `receiving`, `sacks`, and `tackles`. Missing ESPN data is exposed as `null` rather than borrowing a player from the other team. Passing detail contains completions/attempts when available; rushing detail carries attempts, receiving detail carries receptions, and tackles detail carries solo tackles.\n\n### Main scoreboard attributes'''
          if '### NFL per-team game leaders' not in doc:
              if doc_anchor not in doc:
                  raise SystemExit('Could not find README documentation anchor')
              doc = doc.replace(doc_anchor, doc_block, 1)
              readme.write_text(doc)
          PY

      - name: Validate Python and tests
        run: |
          python -m compileall -q custom_components/sports_ticker
          python -m unittest discover -s tests -v

      - name: Commit changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/nfl-team-leaders-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sports_ticker/coordinator.py README.md .github/workflows/nfl-team-leaders-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add per-team NFL game leaders"
          git push
