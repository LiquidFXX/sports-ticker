type: custom:button-card
entity: sensor.espn_nfl_scoreboard_raw
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
hold_action:
  action: none
triggers_update: all
grid_options:
  columns: 20
  rows: auto

variables:
  src: sensor.espn_nfl_scoreboard_raw
  title: GAME HIGHLIGHTS
  subtitle: FINAL GAMES
  preview_items: 4
  max_items: 16
  prefer_favorite_game: false

styles:
  card:
    - padding: 0
    - border-radius: 22px
    - overflow: hidden
    - background: rgba(8,14,24,0.97)
    - border: 1px solid rgba(255,255,255,0.14)
    - box-shadow: 0 18px 42px rgba(0,0,0,0.28)
    - container-type: inline-size
  grid:
    - grid-template-areas: '"content"'
    - grid-template-columns: 1fr
    - grid-template-rows: auto
  custom_fields:
    content:
      - width: 100%
      - min-width: 0
      - pointer-events: auto

custom_fields:
  content: |
    [[[
      const st = states[variables.src];

      const esc = value =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");

      const truthy = value => !(
        value === false ||
        String(value).toLowerCase() === "false"
      );

      const getLogo = team =>
        team?.logo ||
        team?.logos?.[0]?.href ||
        team?.logos?.[0]?.url ||
        "";

      const getColor = team => {
        const color = String(team?.color || "").replace("#", "").trim();
        return /^[0-9A-Fa-f]{6}$/.test(color) ? `#${color}` : "#334155";
      };

      const getTeams = comp =>
        Array.isArray(comp?.competitors) ? comp.competitors : [];

      const getAway = comp =>
        getTeams(comp).find(x => x?.homeAway === "away") || {};

      const getHome = comp =>
        getTeams(comp).find(x => x?.homeAway === "home") || {};

      const abbr = competitor =>
        competitor?.team?.abbreviation ||
        competitor?.team?.shortDisplayName ||
        "TEAM";

      const formatDuration = raw => {
        const total = Number(raw || 0);
        if (!Number.isFinite(total) || total <= 0) return "";
        const minutes = Math.floor(total / 60);
        const seconds = Math.floor(total % 60);
        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      };

      const headlineObjects = (event, comp) => [
        ...(Array.isArray(comp?.headlines) ? comp.headlines : []),
        ...(Array.isArray(event?.headlines) ? event.headlines : [])
      ];

      const getVideos = (event, comp) => {
        const videos = [];
        if (Array.isArray(comp?.highlights)) videos.push(...comp.highlights);
        if (Array.isArray(event?.highlights)) videos.push(...event.highlights);

        headlineObjects(event, comp).forEach(headline => {
          if (Array.isArray(headline?.video)) videos.push(...headline.video);
        });

        const seen = new Set();
        return videos.filter(video => {
          const key = String(video?.id || video?.headline || video?.thumbnail || "");
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      };

      const directVideo = video => {
        const links = video?.links || {};
        return (
          links?.source?.HD?.href ||
          links?.source?.href ||
          links?.source?.mezzanine?.href ||
          links?.HD?.href ||
          links?.mezzanine?.href ||
          ""
        );
      };

      const webVideo = video =>
        video?.links?.web?.href ||
        video?.links?.self?.href ||
        "";

      if (!st) {
        return `
          <div class="hr-empty">
            <div class="hr-empty-title">GAME HIGHLIGHTS</div>
            <div class="hr-empty-sub">Scoreboard unavailable</div>
          </div>
        `;
      }

      const attrs = st.attributes || {};
      const events = Array.isArray(attrs.events) ? attrs.events : [];
      const favorite = String(attrs.favorite_team || "").trim().toUpperCase();
      const preferFavorite = truthy(variables.prefer_favorite_game);
      const previewItems = Math.max(1, Math.min(4, Number(variables.preview_items || 4)));
      const maxItems = Math.max(previewItems, Math.min(24, Number(variables.max_items || 16)));
      const items = [];

      events.forEach(event => {
        const comp = event?.competitions?.[0] || {};
        const away = getAway(comp);
        const home = getHome(comp);
        const awayAbbr = abbr(away);
        const homeAbbr = abbr(home);
        const status = comp?.status || event?.status || {};
        const state = String(status?.type?.state || "").toLowerCase();
        const date = comp?.date || event?.date || "";
        const isFavorite = !!favorite && (
          String(awayAbbr).toUpperCase() === favorite ||
          String(homeAbbr).toUpperCase() === favorite
        );

        const headlines = headlineObjects(event, comp);
        const recap = headlines.find(
          headline => String(headline?.type || "").toLowerCase() === "recap"
        ) || headlines[0] || {};

        getVideos(event, comp).forEach(video => {
          const direct = directVideo(video);
          if (!direct) return;

          items.push({
            direct,
            web: webVideo(video),
            thumbnail: video?.thumbnail || "",
            duration: formatDuration(video?.duration),
            title:
              video?.headline ||
              video?.description ||
              recap?.shortLinkText ||
              `${awayAbbr} vs. ${homeAbbr}: Game Highlights`,
            away,
            home,
            awayAbbr,
            homeAbbr,
            awayLogo: getLogo(away?.team),
            homeLogo: getLogo(home?.team),
            awayColor: getColor(away?.team),
            homeColor: getColor(home?.team),
            state,
            date,
            favorite: isFavorite
          });
        });
      });

      items.sort((a, b) => {
        if (preferFavorite && a.favorite !== b.favorite) return a.favorite ? -1 : 1;
        const aState = a.state === "post" ? 0 : 1;
        const bState = b.state === "post" ? 0 : 1;
        if (aState !== bState) return aState - bState;
        return new Date(b.date || 0) - new Date(a.date || 0);
      });

      const selected = items.slice(0, maxItems);

      if (!selected.length) {
        return `
          <div class="hr-empty">
            <div class="hr-empty-title">GAME HIGHLIGHTS</div>
            <div class="hr-empty-sub">No playable highlights available</div>
          </div>
        `;
      }

      const hero = selected[0];
      const rail = selected.slice(1, previewItems);
      const extra = selected.slice(previewItems);

      const logo = (url, abbreviation) => {
        if (!url) {
          return `<span class="hr-logo-fallback">${esc(abbreviation)}</span>`;
        }
        return `<img class="hr-logo" src="${esc(url)}" alt="${esc(abbreviation)}">`;
      };

      const renderRail = item => `
        <div class="hr-rail-card">
          <div class="hr-rail-media">
            <video
              class="hr-rail-video"
              playsinline
              preload="metadata"
              ${item.thumbnail ? `poster="${esc(item.thumbnail)}"` : ""}
            >
              <source src="${esc(item.direct)}" type="video/mp4">
            </video>

            <div class="hr-rail-shade"></div>

            <button
              type="button"
              class="hr-play hr-play-small"
              onclick="
                event.preventDefault();
                event.stopPropagation();

                const media = this.closest('.hr-rail-media');
                const video = media.querySelector('.hr-rail-video');
                const duration = media.querySelector('.hr-small-duration');
                const shade = media.querySelector('.hr-rail-shade');
                const shell = media.closest('.hr-shell');

                shell.querySelectorAll('video').forEach(other => {
                  if (other !== video) other.pause();
                });

                video.controls = true;
                video.play();
                this.style.display = 'none';
                if (duration) duration.style.display = 'none';
                if (shade) shade.style.display = 'none';

                video.onended = () => {
                  video.controls = false;
                  video.currentTime = 0;
                  this.style.display = 'flex';
                  if (duration) duration.style.display = 'block';
                  if (shade) shade.style.display = 'block';
                };
              "
            >â–¶</button>

            ${item.duration ? `
              <div class="hr-duration hr-small-duration">${esc(item.duration)}</div>
            ` : ""}
          </div>

          <div class="hr-rail-details">
            <div class="hr-red-bar"></div>

            <div class="hr-rail-matchup">
              <div class="hr-mini-team hr-mini-away">
                ${logo(item.awayLogo, item.awayAbbr)}
                <strong>${esc(item.awayAbbr)}</strong>
              </div>

              <div class="hr-vs">VS</div>

              <div class="hr-mini-team hr-mini-home">
                ${logo(item.homeLogo, item.homeAbbr)}
                <strong>${esc(item.homeAbbr)}</strong>
              </div>
            </div>

            <div class="hr-rail-footer">
              <span class="hr-red-dot"></span>
              <span class="hr-game-label">GAME HIGHLIGHTS</span>
              ${item.web ? `
                <a
                  class="hr-espn-link"
                  href="${esc(item.web)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  onclick="event.stopPropagation();"
                >ESPN â†¨</a>
              ` : ""}
            </div>
          </div>
        </div>
      `;

      return `
        <div class="hr-shell">
          <div class="hr-header">
            <div class="hr-header-left">
              <div class="hr-header-icon">
                <ha-icon class="hr-header-ha-icon" icon="mdi:movie-open-play-outline"></ha-icon>
              </div>

              <div class="hr-header-text">
                <div class="hr-title">${esc(variables.title || "GAME HIGHLIGHTS")}</div>
                <div class="hr-subtitle">${esc(variables.subtitle || "FINAL GAMES")}</div>
              </div>
            </div>

            <div class="hr-highlight-badge">
              <span class="hr-red-dot"></span>
              HIGHLIGHTS
            </div>
          </div>

          <div class="hr-featured">
            <div class="hr-featured-media">
              <video
                class="hr-video"
                playsinline
                preload="metadata"
                ${hero.thumbnail ? `poster="${esc(hero.thumbnail)}"` : ""}
              >
                <source src="${esc(hero.direct)}" type="video/mp4">
              </video>

              <button
                type="button"
                class="hr-play hr-play-main"
                onclick="
                  event.preventDefault();
                  event.stopPropagation();

                  const media = this.closest('hr-featured-media');
                  const video = media.querySelector('.hr-video');
                  const duration = media.querySelector('.hr-duration');
                  const shell = media.closest('.hr-shell');

                  shell.querySelectorAll('video').forEach(other => {
                    if (other !== video) other.pause();
                  });

                  video.controls = true;
                  video.play();
                  this.style.display = 'none';
                  if (duration) duration.style.display = 'none';

                  video.onended = () => {
                    video.controls = false;
                    video.currentTime = 0;
                    this.style.display = 'flex';
                    if (duration) duration.style.display = 'block';
                  };
              "
              >â–¶</button>

              ${hero.duration ? `
                <div class="hr-duration">${esc(hero.duration)}</div>
              ` : ""}
            </div>

            <div class="hr-featured-info">
              <div class="hr-featured-title">${esc(hero.title)}</div>

              <div class="hr-score-row">
                <div class="hr-team-chip hr-team-away" style="--team-color:${esc(hero.awayColor)};">
                  ${logo(hero.awayLogo, hero.awayAbbr)}
                  <span>${esc(hero.awayAbbr)}</span>
                </div>

                <strong class="hr-score">${esc(hero.away?.score ?? "â€”")}</strong>
                <div class="hr-score-divider"></div>
                <strong class="hr-score">${esc(hero.home?.score ?? "â€”")}</strong>

                <div class="hr-team-chip hr-team-home" style="--team-color:${esc(hero.homeColor)};">
                  <span>${esc(hero.homeAbbr)}</span>
                  ${logo(hero.homeLogo, hero.homeAbbr)}
                </div>
              </div>

              <div class="hr-final">${hero.state === "post" ? "FINAL" : "HIGHLIGHT"}</div>

              ${hero.web ? `
                <a
                  class="hr-featured-espn"
                  href="${esc(hero.web)}"
                  target="_blank"
                  rel="noopener noreferrer"
                >ESPN â†—</a>
              ` : ""}
            </div>
          </div>

          ${rail.length ? `
            <div class="hr-rail">
              ${rail.map(renderRail).join("")}
            </div>
          ` : ""}

          ${extra.length ? `
            <button
              type="button"
              class="hr-view-all"
              onclick="
                event.preventDefault();
                event.stopPropagation();

