name: Cleanup NFL examples

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-nfl-examples.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove incorrect NFL examples
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('examples/NFL.md')
          text = path.read_text()

          # Keep only Examples 1-3 in the layout table.
          text = re.sub(r'^\| [4-7]\. .*\n', '', text, flags=re.M)

          # Remove the actual Example 4-7 sections while preserving Troubleshooting.
          text = re.sub(
              r'\n---\n\n## 4\. What\'s on this week.*?\n## 🛠️ Troubleshooting',
              '\n\n## 🛠️ Troubleshooting',
              text,
              flags=re.S,
          )

          path.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/cleanup-nfl-examples.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/NFL.md .github/workflows/cleanup-nfl-examples.yml
          git commit -m "Remove incorrect NFL examples 4-7"
          git push
