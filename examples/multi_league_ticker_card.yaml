# ==============================================================
# SPORTS TICKER - MULTI-SPORT SCROLLING CARD
#
# NEW USER NOTES
# --------------------------------------------------------------
# Requirements:
#   - Sports Ticker integration
#   - custom:button-card
#   - card-mod
#
# The `sports:` list below controls which leagues actually appear
# in the scrolling ticker. Add one block for each league you want.
#
# Common `kind` values:
#   football   -> NFL / college football style clock + alerts
#   baseball   -> MLB style inning display + baseball alerts
#   basketball -> NBA/WNBA style quarter + clock
#   hockey     -> NHL style period + clock
#   generic    -> fallback for other sports
#
# `teams: null` means show every game for that league.
# To limit a league to specific teams, use abbreviations, for example:
#   teams:
#     - ATL
#     - TB
#
# `enabled: false` hides a league without deleting its config.
#
# `seconds_per_game` controls ticker speed:
#   higher number = slower scrolling
#   lower number  = faster scrolling
#
# `highlight_favorite: true` adds a favorite marker when the
# scoreboard sensor exposes a matching `favorite_team` attribute.
#
# Alerts can be disabled globally with:
#   alerts:
#     enabled: false
#
# IMPORTANT FOR THIS EXAMPLE:
# The supplied configuration below currently has MLB as the active
# entry under `sports:`. To display NFL as well, add this block:
#
#   - label: NFL
#     entity: sensor.espn_nfl_scoreboard_raw
#     kind: football
#     accent: '#2563eb'
#     enabled: true
#     teams: null
# ==============================================================

type: custom:button-card

# This entity is used for the card's more-info action.
# The leagues displayed in the ticker are controlled by `variables.sports`.
entity: sensor.espn_nfl_scoreboard_raw

show_name: false
show_icon: false
show_state: false

# Re-render when Home Assistant states change so scores/status stay current.
triggers_update: all

tap_action:
  action: more-info

# Optional dashboard sizing. Adjust/remove if your dashboard layout
# does not use grid_options.
grid_options:
  columns: 50
  rows: auto

variables:

  # ------------------------------------------------------------
  # LEAGUES TO DISPLAY
  # Add one block per league.
  # ------------------------------------------------------------
  sports:

    # Active example from the supplied YAML.
    - label: MLB
      entity: sensor.espn_mlb_scoreboard_raw
      kind: baseball
      accent: '#ef4444'
      enabled: true

      # null = all teams.
      # Or use a list such as: [ATL, NYY]
      teams: null

    # Example NFL block - remove the leading # characters to enable.
    #
    # - label: NFL
    #   entity: sensor.espn_nfl_scoreboard_raw
    #   kind: football
    #   accent: '#2563eb'
    #   enabled: true
    #   teams: null

  # Approximate amount of scroll time allocated per game.
  # Increase this to slow the ticker down.
  seconds_per_game: 8

  # Set true to visually mark games involving the configured favorite team.
  highlight_favorite: false

  # ------------------------------------------------------------
  # SPECIAL GAME ALERTS
  #
  # Set any individual option to false to disable that alert.
  # Set `enabled: false` to disable all special alerts.
  # ------------------------------------------------------------
  alerts:
    enabled: true

    baseball:
      # No-hit/perfect-game alerts are only considered at or after
      # this inning.
      minimum_inning: 7
      no_hit_bid: true
      perfect_game_bid: true
      extra_innings: true
      tied_late: true
      close_late: true

    football:
      overtime: true
      red_zone: true
      tied_late: true
      close_late: true

    basketball:
      overtime: true
      tied_late: true
      close_late: true

    hockey:
      overtime: true
      tied_late: true
      close_late: true
styles:
  card:
    - padding: 0
    - border-radius: 18px
    - overflow: hidden
    - border: 1px solid rgba(255,255,255,0.13)
    - background: rgba(12,18,28,0.64)
    - box-shadow: 0 8px 28px rgba(0,0,0,0.18)
    - backdrop-filter: blur(20px) saturate(145%)
    - -webkit-backdrop-filter: blur(20px) saturate(145%)
    - container-type: inline-size
  grid:
    - grid-template-areas: '"ticker"'
    - grid-template-columns: 1fr
    - grid-template-rows: auto
  custom_fields:
    ticker:
      - width: 100%
      - overflow: hidden
custom_fields:
  ticker: |
    [[[
      const sports =
        Array.isArray(variables.sports)
          ? variables.sports
          : [];

      const alertConfig =
        variables.alerts || {};

      const alertsEnabled =
        !(
          alertConfig.enabled === false ||
          String(
            alertConfig.enabled
          ).toLowerCase() === "false"
        );

      const highlightFavorite =
        !(
          variables.highlight_favorite === false ||
          String(
            variables.highlight_favorite
          ).toLowerCase() === "false"
        );


      /*
       * ========================================================
       * HELPERS
       * ========================================================
       */

      const esc = value =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");


      const normalizeTeam = value =>
        String(value ?? "")
          .trim()
          .toUpperCase();


      const boolEnabled = value =>
        !(
          value === false ||
          String(value).toLowerCase() === "false"
        );


      const numberValue = value => {

        if (
          value === null ||
          value === undefined ||
          value === ""
        ) {
          return null;
        }

        const n =
          Number.parseFloat(value);

        return Number.isFinite(n)
          ? n
          : null;
      };


      const parseClockSeconds = clock => {

        const text =
          String(clock || "")
            .trim();

        const match =
          text.match(
            /^(\d+):(\d{1,2})$/
          );

        if (!match)
          return null;

        return (
          Number(match[1]) * 60 +
          Number(match[2])
        );
      };


      const getLogo = team =>
        team?.logo ||
        team?.logos?.[0]?.href ||
        team?.logos?.[0]?.url ||
        "";


      /*
       * Try to locate team statistics regardless of
       * whether ESPN stores them under statistics,
       * stats, or directly on the competitor.
       */

      const readTeamStat = (
        competitor,
        names
      ) => {

        const wanted =
          names.map(
            name =>
              String(name)
                .toLowerCase()
                .replace(
                  /[^a-z0-9]/g,
                  ""
                )
          );


        const directSources = [
          competitor,
          competitor?.team
        ];


        for (
          const source
          of directSources
        ) {

          if (!source)
            continue;


          for (
            const key
            of Object.keys(source)
          ) {

            const normalized =
              key
                .toLowerCase()
                .replace(
                  /[^a-z0-9]/g,
                  ""
                );


            if (
              wanted.includes(
                normalized
              )
            ) {

              const n =
                numberValue(
                  source[key]
                );

              if (n !== null)
                return n;
            }
          }
        }


        const collections = [
          competitor?.statistics,
          competitor?.stats,
          competitor?.team?.statistics,
          competitor?.team?.stats
        ];


        for (
          const collection
          of collections
        ) {

          if (
            !Array.isArray(
              collection
            )
          ) {
            continue;
          }


          for (
            const stat
            of collection
          ) {

            const namesToCheck = [

              stat?.name,

              stat?.abbreviation,

              stat?.shortDisplayName,

              stat?.displayName,

              stat?.label

            ]
              .filter(Boolean)
              .map(
                name =>
                  String(name)
                    .toLowerCase()
                    .replace(
                      /[^a-z0-9]/g,
                      ""
                    )
              );


            if (
              !namesToCheck.some(
                name =>
                  wanted.includes(name)
              )
            ) {
              continue;
            }


            const candidate =
              stat?.value ??
              stat?.displayValue ??
              stat?.summary;


            const n =
              numberValue(
                candidate
              );


            if (n !== null)
              return n;
          }
        }


        return null;
      };


      const logoHtml = (
        url,
        abbreviation
      ) => {

        if (!url) {

          return `
            <div
              class="team-logo-shell"
              title="${esc(abbreviation)}"
            >

              <div class="logo-fallback">
                ${esc(abbreviation)}
              </div>

            </div>
          `;
        }


        return `
          <div
            class="team-logo-shell"
            title="${esc(abbreviation)}"
          >

            <img
              class="team-logo"
              src="${esc(url)}"
              alt="${esc(abbreviation)}"
              loading="lazy"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="logo-fallback"
              style="display:none"
            >
              ${esc(abbreviation)}
            </div>

          </div>
        `;
      };


      const formatKickoff = raw => {

        if (!raw)
          return "";

        const d =
          new Date(raw);

        if (
          Number.isNaN(
            d.getTime()
          )
        ) {
          return "";
        }


        const now =
          new Date();


        const today =
          d.toDateString() ===
          now.toDateString();


        const tomorrowDate =
          new Date(now);

        tomorrowDate.setDate(
          now.getDate() + 1
        );


        const tomorrow =
          d.toDateString() ===
          tomorrowDate.toDateString();


        let day;


        if (today) {

          day = "TODAY";

        }

        else if (tomorrow) {

          day = "TOM";

        }

        else {

          day =
            d.toLocaleDateString(
              undefined,
              {
                weekday: "short"
              }
            )
              .toUpperCase();
        }


        const time =
          d.toLocaleTimeString(
            undefined,
            {
              hour: "numeric",
              minute: "2-digit"
            }
          );


        return `${day} ${time}`;
      };


      /*
       * ========================================================
       * PERIOD HELPERS
       * ========================================================
       */

      const footballPeriod = period => {

        const p =
          Number(period || 0);

        if (!p)
          return "";

        if (p <= 4)
          return `Q${p}`;

        if (p === 5)
          return "OT";

        return `${p - 4}OT`;
      };


      const basketballPeriod = period => {

        const p =
          Number(period || 0);

        if (!p)
          return "";

        if (p <= 4)
          return `Q${p}`;

        return "OT";
      };


      const hockeyPeriod = period => {

        const p =
          Number(period || 0);

        if (!p)
          return "";

        if (p === 1)
          return "1ST";

        if (p === 2)
          return "2ND";

        if (p === 3)
          return "3RD";

        return "OT";
      };


      const baseballDetail = detail => {

        const text =
          String(
            detail || ""
          ).trim();


        const match =
          text.match(
            /^(Top|Bot|Bottom|Mid|End)\s+(\d+)/i
          );


        if (!match)
          return text.toUpperCase();


        const half =
          match[1].toLowerCase();

        const inning =
          match[2];


        if (half === "top")
          return `▲ TOP ${inning}`;


        if (
          half === "bot" ||
          half === "bottom"
        ) {
          return `▼ BOT ${inning}`;
        }


        if (half === "mid")
          return `MID ${inning}`;


        if (half === "end")
          return `END ${inning}`;


        return text.toUpperCase();
      };


      const baseballInning = game => {

        const period =
          Number(
            game?.status?.period || 0
          );


        if (period)
          return period;


        const detail =
          String(
            game?.type?.shortDetail ||
            game?.type?.detail ||
            ""
          );


        const match =
          detail.match(
            /(Top|Bot|Bottom|Mid|End)\s+(\d+)/i
          );


        return match
          ? Number(match[2])
          : 0;
      };


      const liveDetail = (
        kind,
        status,
        type
      ) => {

        const period =
          status?.period || 0;

        const clock =
          status?.displayClock || "";

        const shortDetail =
          type?.shortDetail ||
          type?.detail ||
          "";


        switch (
          String(kind || "")
            .toLowerCase()
        ) {

          case "football":

            return [
              footballPeriod(period),
              clock
            ]
              .filter(Boolean)
              .join(" ");


          case "basketball":

            return [
              basketballPeriod(period),
              clock
            ]
              .filter(Boolean)
              .join(" ");


          case "hockey":

            return [
              hockeyPeriod(period),
              clock
            ]
              .filter(Boolean)
              .join(" ");


          case "baseball":

            return baseballDetail(
              shortDetail
            );


          default:

            return (
              shortDetail ||
              clock ||
              "IN PROGRESS"
            );
        }
      };


      /*
       * ========================================================
       * ALERT ENGINE
       * ========================================================
       */

      const gameAlert = (
        game,
        group
      ) => {

        if (!alertsEnabled)
          return null;


        if (
          game.state !== "in" &&
          game.state !== "post"
        ) {
          return null;
        }


        const kind =
          String(
            group.kind || ""
          ).toLowerCase();


        const awayScore =
          numberValue(
            game.awayScore
          );

        const homeScore =
          numberValue(
            game.homeScore
          );


        const scoreDiff =
          (
            awayScore !== null &&
            homeScore !== null
          )
            ? Math.abs(
                awayScore -
                homeScore
              )
            : null;


        const tied =
          (
            awayScore !== null &&
            homeScore !== null &&
            awayScore === homeScore
          );


        /*
         * ------------------------------------------------------
         * BASEBALL
         * ------------------------------------------------------
         */

        if (kind === "baseball") {

          const cfg =
            alertConfig.baseball ||
            {};


          const inning =
            baseballInning(game);


          const minimumInning =
            Math.max(
              1,
              Number(
                cfg.minimum_inning ||
                7
              )
            );


          const awayHits =
            readTeamStat(
              game.awayRaw,
              [
                "hits",
                "H"
              ]
            );


          const homeHits =
            readTeamStat(
              game.homeRaw,
              [
                "hits",
                "H"
              ]
            );


          /*
           * Conservative perfect-game support.
           *
           * We only use an explicit "times reached base"
           * style statistic. We DO NOT infer a perfect
           * game merely from zero hits.
           */

          const awayReached =
            readTeamStat(
              game.awayRaw,
              [
                "timesReachedBase",
                "timesOnBase",
                "reachedBaseCount",
                "battersReachedBase"
              ]
            );


          const homeReached =
            readTeamStat(
              game.homeRaw,
              [
                "timesReachedBase",
                "timesOnBase",
                "reachedBaseCount",
                "battersReachedBase"
              ]
            );


          const perfectBid =
            (
              inning >=
                minimumInning
            ) &&
            (
              (
                awayHits === 0 &&
                awayReached === 0
              ) ||
              (
                homeHits === 0 &&
                homeReached === 0
              )
            );


          const noHitBid =
            (
              inning >=
                minimumInning
            ) &&
            (
              awayHits === 0 ||
              homeHits === 0
            );


          /*
           * PERFECT GAME
           */

          if (
            boolEnabled(
              cfg.perfect_game_bid
            ) &&
            perfectBid
          ) {

            if (
              game.state === "post" &&
              inning >= 9
            ) {

              return {
                level: "elite",
                icon: "◆",
                text: "PERFECT GAME"
              };
            }


            if (
              game.state === "in"
            ) {

              return {
                level: "elite",
                icon: "◆",
                text: "PERFECT GAME BID"
              };
            }
          }


          /*
           * NO-HITTER
           */

          if (
            boolEnabled(
              cfg.no_hit_bid
            ) &&
            noHitBid
          ) {

            if (
              game.state === "post" &&
              inning >= 9
            ) {

              return {
                level: "hot",
                icon: "🔥",
                text: "NO-HITTER"
              };
            }


            if (
              game.state === "in"
            ) {

              return {
                level: "hot",
                icon: "🔥",
                text: "NO-HIT BID"
              };
            }
          }


          /*
           * EXTRA INNINGS
           */

          if (
            game.state === "in" &&
            inning >= 10 &&
            boolEnabled(
              cfg.extra_innings
            )
          ) {

            return {
              level: "watch",
              icon: "⚡",
              text: "EXTRA INNINGS"
            };
          }


          /*
           * TIED LATE
           */

          if (
            game.state === "in" &&
            inning >= 8 &&
            tied &&
            boolEnabled(
              cfg.tied_late
            )
          ) {

            return {
              level: "hot",
              icon: "🔥",
              text: "TIED LATE"
            };
          }


          /*
           * ONE-RUN GAME
           */

          if (
            game.state === "in" &&
            inning >= 8 &&
            scoreDiff === 1 &&
            boolEnabled(
              cfg.close_late
            )
          ) {

            return {
              level: "watch",
              icon: "⚡",
              text: "ONE-RUN GAME"
            };
          }
        }


        /*
         * ------------------------------------------------------
         * FOOTBALL
         * ------------------------------------------------------
         */

        if (kind === "football") {

          const cfg =
            alertConfig.football ||
            {};


          const period =
            Number(
              game.status?.period ||
              0
            );


          const clockSeconds =
            parseClockSeconds(
              game.status?.displayClock
            );


          const situation =
            game.comp?.situation ||
            game.event?.situation ||
            {};


          const redZone =
            situation?.isRedZone === true ||
            situation?.redZone === true ||
            situation?.is_red_zone === true;


          if (
            game.state === "in" &&
            period >= 5 &&
            boolEnabled(
              cfg.overtime
            )
          ) {

            return {
              level: "elite",
              icon: "⚡",
              text: "OVERTIME"
            };
          }


          if (
            game.state === "in" &&
            redZone &&
            boolEnabled(
              cfg.red_zone
            )
          ) {

            return {
              level: "hot",
              icon: "●",
              text: "RED ZONE"
            };
          }


          if (
            game.state === "in" &&
            period === 4 &&
            clockSeconds !== null &&
            clockSeconds <= 300 &&
            tied &&
            boolEnabled(
              cfg.tied_late
            )
          ) {

            return {
              level: "hot",
              icon: "🔥",
              text: "TIED LATE"
            };
          }


          if (
            game.state === "in" &&
            period === 4 &&
            clockSeconds !== null &&
            clockSeconds <= 300 &&
            scoreDiff !== null &&
            scoreDiff <= 8 &&
            boolEnabled(
              cfg.close_late
            )
          ) {

            return {
              level: "watch",
              icon: "⚡",
              text: "ONE-SCORE GAME"
            };
          }
        }


        /*
         * ------------------------------------------------------
         * BASKETBALL
         * ------------------------------------------------------
         */

        if (kind === "basketball") {

          const cfg =
            alertConfig.basketball ||
            {};


          const period =
            Number(
              game.status?.period ||
              0
            );


          const clockSeconds =
            parseClockSeconds(
              game.status?.displayClock
            );


          if (
            game.state === "in" &&
            period >= 5 &&
            boolEnabled(
              cfg.overtime
            )
          ) {

            return {
              level: "elite",
              icon: "⚡",
              text: "OVERTIME"
            };
          }


          if (
            game.state === "in" &&
            period === 4 &&
            clockSeconds !== null &&
            clockSeconds <= 120 &&
            tied &&
            boolEnabled(
              cfg.tied_late
            )
          ) {

            return {
              level: "hot",
              icon: "🔥",
              text: "TIED LATE"
            };
          }


          if (
            game.state === "in" &&
            period === 4 &&
            clockSeconds !== null &&
            clockSeconds <= 120 &&
            scoreDiff !== null &&
            scoreDiff <= 3 &&
            boolEnabled(
              cfg.close_late
            )
          ) {

            return {
              level: "watch",
              icon: "⚡",
              text: "ONE-POSSESSION GAME"
            };
          }
        }


        /*
         * ------------------------------------------------------
         * HOCKEY
         * ------------------------------------------------------
         */

        if (kind === "hockey") {

          const cfg =
            alertConfig.hockey ||
            {};


          const period =
            Number(
              game.status?.period ||
              0
            );


          const clockSeconds =
            parseClockSeconds(
              game.status?.displayClock
            );


          if (
            game.state === "in" &&
            period >= 4 &&
            boolEnabled(
              cfg.overtime
            )
          ) {

            return {
              level: "elite",
              icon: "⚡",
              text: "OVERTIME"
            };
          }


          if (
            game.state === "in" &&
            period === 3 &&
            clockSeconds !== null &&
            clockSeconds <= 300 &&
            tied &&
            boolEnabled(
              cfg.tied_late
            )
          ) {

            return {
              level: "hot",
              icon: "🔥",
              text: "TIED LATE"
            };
          }


          if (
            game.state === "in" &&
            period === 3 &&
            clockSeconds !== null &&
            clockSeconds <= 300 &&
            scoreDiff === 1 &&
            boolEnabled(
              cfg.close_late
            )
          ) {

            return {
              level: "watch",
              icon: "⚡",
              text: "ONE-GOAL GAME"
            };
          }
        }


        return null;
      };


      const alertHtml = alert => {

        if (!alert)
          return "";


        return `
          <span
            class="
              special-alert
              alert-${esc(alert.level)}
            "
          >

            <span class="alert-icon">
              ${esc(alert.icon)}
            </span>

            <span>
              ${esc(alert.text)}
            </span>

          </span>
        `;
      };


      /*
       * ========================================================
       * BUILD LEAGUE GROUPS
       * ========================================================
       */

      const groups = [];


      sports.forEach(
        (sport, sportIndex) => {

          const enabled =
            !(
              sport?.enabled === false ||
              String(
                sport?.enabled
              ).toLowerCase() === "false"
            );


          if (!enabled)
            return;


          const entityId =
            sport?.entity || "";


          if (!entityId)
            return;


          const st =
            states[entityId];


          if (
            !st ||
            st.state === "unavailable" ||
            st.state === "unknown"
          ) {
            return;
          }


          const attrs =
            st.attributes || {};


          const events =
            Array.isArray(
              attrs.events
            )
              ? attrs.events
              : [];


          if (!events.length)
            return;


          const selectedTeams =
            Array.isArray(
              sport?.teams
            )
              ? sport.teams
                  .map(
                    team =>
                      normalizeTeam(team)
                  )
                  .filter(Boolean)
              : [];


          const favorite =
            normalizeTeam(
              attrs.favorite_team || ""
            );


          let games =
            events.map(
              (event, eventIndex) => {

                const comp =
                  event?.competitions?.[0] ||
                  {};


                const competitors =
                  Array.isArray(
                    comp.competitors
                  )
                    ? comp.competitors
                    : [];


                const away =
                  competitors.find(
                    team =>
                      team?.homeAway === "away"
                  ) || {};


                const home =
                  competitors.find(
                    team =>
                      team?.homeAway === "home"
                  ) || {};


                const awayTeam =
                  away?.team || {};


                const homeTeam =
                  home?.team || {};


                const awayAbbr =
                  awayTeam?.abbreviation ||
                  awayTeam?.shortDisplayName ||
                  "AWY";


                const homeAbbr =
                  homeTeam?.abbreviation ||
                  homeTeam?.shortDisplayName ||
                  "HOM";


                const awayKey =
                  normalizeTeam(
                    awayAbbr
                  );


                const homeKey =
                  normalizeTeam(
                    homeAbbr
                  );


                const status =
                  comp?.status ||
                  event?.status ||
                  {};


                const type =
                  status?.type || {};


                const state =
                  String(
                    type?.state || "pre"
                  ).toLowerCase();


                const start =
                  comp?.date ||
                  event?.date ||
                  "";


                const isFavorite =
                  !!favorite &&
                  (
                    awayKey === favorite ||
                    homeKey === favorite
                  );


                return {

                  awayAbbr,
                  homeAbbr,

                  awayKey,
                  homeKey,

                  awayLogo:
                    getLogo(
                      awayTeam
                    ),

                  homeLogo:
                    getLogo(
                      homeTeam
                    ),

                  awayScore:
                    away?.score ?? "",

                  homeScore:
                    home?.score ?? "",

                  awayRaw:
                    away,

                  homeRaw:
                    home,

                  comp,
                  event,

                  status,
                  type,
                  state,
                  start,
                  isFavorite,
                  eventIndex
                };
              }
            );


          /*
           * ====================================================
           * TEAM FILTER
           * ====================================================
           */

          if (
            selectedTeams.length
          ) {

            games =
              games.filter(
                game =>
                  selectedTeams.includes(
                    game.awayKey
                  ) ||
                  selectedTeams.includes(
                    game.homeKey
                  )
              );
          }


          if (!games.length)
            return;


          games.sort(
            (a, b) =>
              new Date(
                a.start || 0
              ) -
              new Date(
                b.start || 0
              )
          );


          groups.push({

            label:
              sport?.label ||
              "SPORT",

            kind:
              sport?.kind ||
              "generic",

            accent:
              sport?.accent ||
              "#64748b",

            index:
              sportIndex,

            games
          });

        }
      );


      /*
       * ========================================================
       * EMPTY
       * ========================================================
       */

      if (!groups.length) {

        return `
          <div class="ticker-shell">

            <div class="league-label">

              <div
                class="league-name"
                style="
                  opacity:1;
                  visibility:visible;
                  --league-accent:#64748b;
                "
              >

                <span class="league-text">
                  SPORTS
                </span>

              </div>

            </div>


            <div class="ticker-message">
              No matching games available
            </div>

          </div>
        `;
      }


      /*
       * ========================================================
       * TIMING
       * ========================================================
       */

      const totalGames =
        groups.reduce(
          (sum, group) =>
            sum +
            group.games.length,
          0
        );


      const secondsPerGame =
        Math.max(
          1.5,
          Number(
            variables.seconds_per_game ||
            3.5
          )
        );


      const duration =
        Math.max(
          16,
          totalGames *
          secondsPerGame
        );


      /*
       * ========================================================
       * GAME RENDERER
       * ========================================================
       */

      const renderGame = (
        game,
        group
      ) => {

        const emphasizeFavorite =
          game.isFavorite &&
          highlightFavorite;


        const specialAlert =
          gameAlert(
            game,
            group
          );


        /*
         * ------------------------------------------------------
         * LIVE
         * ------------------------------------------------------
         */

        if (
          game.state === "in"
        ) {

          const detail =
            liveDetail(
              group.kind,
              game.status,
              game.type
            );


          return `
            <div
              class="
                ticker-game
                live
                ${
                  specialAlert
                    ? "has-alert"
                    : ""
                }
                ${
                  emphasizeFavorite
                    ? "favorite"
                    : ""
                }
              "
            >

              ${
                emphasizeFavorite
                  ? `
                    <span class="favorite-star">
                      ★
                    </span>
                  `
                  : ""
              }


              ${logoHtml(
                game.awayLogo,
                game.awayAbbr
              )}


              <span class="score">
                ${esc(
                  game.awayScore
                )}
              </span>


              <span class="score-separator">
                –
              </span>


              ${logoHtml(
                game.homeLogo,
                game.homeAbbr
              )}


              <span class="score">
                ${esc(
                  game.homeScore
                )}
              </span>


              ${
                specialAlert
                  ? alertHtml(
                      specialAlert
                    )
                  : `
                    <span class="live-status">

                      <span class="live-dot">
                      </span>

                      <span>
                        LIVE
                      </span>

                      ${
                        detail
                          ? `
                            <span class="status-detail">
                              ${esc(detail)}
                            </span>
                          `
                          : ""
                      }

                    </span>
                  `
              }

            </div>
          `;
        }


        /*
         * ------------------------------------------------------
         * FINAL
         * ------------------------------------------------------
         */

        if (
          game.state === "post"
        ) {

          return `
            <div
              class="
                ticker-game
                final
                ${
                  specialAlert
                    ? "has-alert"
                    : ""
                }
                ${
                  emphasizeFavorite
                    ? "favorite"
                    : ""
                }
              "
            >

              ${
                emphasizeFavorite
                  ? `
                    <span class="favorite-star">
                      ★
                    </span>
                  `
                  : ""
              }


              ${logoHtml(
                game.awayLogo,
                game.awayAbbr
              )}


              <span class="score">
                ${esc(
                  game.awayScore
                )}
              </span>


              <span class="score-separator">
                –
              </span>


              ${logoHtml(
                game.homeLogo,
                game.homeAbbr
              )}


              <span class="score">
                ${esc(
                  game.homeScore
                )}
              </span>


              ${
                specialAlert
                  ? alertHtml(
                      specialAlert
                    )
                  : `
                    <span class="final-status">
                      FINAL
                    </span>
                  `
              }

            </div>
          `;
        }


        /*
         * ------------------------------------------------------
         * UPCOMING
         * ------------------------------------------------------
         */

        return `
          <div
            class="
              ticker-game
              upcoming
              ${
                emphasizeFavorite
                  ? "favorite"
                  : ""
              }
            "
          >

            ${
              emphasizeFavorite
                ? `
                  <span class="favorite-star">
                    ★
                  </span>
                `
                : ""
            }


            ${logoHtml(
              game.awayLogo,
              game.awayAbbr
            )}


            <span class="at">
              @
            </span>


            ${logoHtml(
              game.homeLogo,
              game.homeAbbr
            )}


            <span class="kickoff">
              ${esc(
                formatKickoff(
                  game.start
                )
              )}
            </span>

          </div>
        `;
      };


      /*
       * ========================================================
       * ALL GAMES
       * ========================================================
       */

      const allGames =
        groups
          .map(
            group =>
              group.games
                .map(
                  game =>
                    renderGame(
                      game,
                      group
                    )
                )
                .join("")
          )
          .join("");


      /*
       * ========================================================
       * LEAGUE LABEL TIMING
       * ========================================================
       */

      let gameOffset = 0;

      const labelHtml = [];

      const labelCss = [];


      groups.forEach(
        (group, index) => {

          const startPct =
            (
              gameOffset /
              totalGames
            ) * 100;


          const endPct =
            (
              (
                gameOffset +
                group.games.length
              ) /
              totalGames
            ) * 100;


          const fade =
            Math.min(
              0.30,
              Math.max(
                0.04,
                (
                  100 /
                  totalGames
                ) * 0.06
              )
            );


          const beforeStart =
            Math.max(
              0,
              startPct - fade
            );


          const afterStart =
            Math.min(
              100,
              startPct + fade
            );


          const beforeEnd =
            Math.max(
              0,
              endPct - fade
            );


          const afterEnd =
            Math.min(
              100,
              endPct + fade
            );


          labelHtml.push(`
            <div
              class="
                league-name
                league-${index}
              "
              style="
                --league-accent:
                  ${esc(group.accent)};
              "
            >

              <span class="league-text">
                ${esc(group.label)}
              </span>

            </div>
          `);


          if (index === 0) {

            labelCss.push(`
              @keyframes league-label-${index} {

                0%,
                ${beforeEnd}% {
                  opacity:1;
                  visibility:visible;
                }

                ${afterEnd}%,
                99.7% {
                  opacity:0;
                  visibility:hidden;
                }

                100% {
                  opacity:1;
                  visibility:visible;
                }

              }
            `);

          }

          else {

            labelCss.push(`
              @keyframes league-label-${index} {

                0%,
                ${beforeStart}% {
                  opacity:0;
                  visibility:hidden;
                }

                ${afterStart}%,
                ${beforeEnd}% {
                  opacity:1;
                  visibility:visible;
                }

                ${afterEnd}%,
                100% {
                  opacity:0;
                  visibility:hidden;
                }

              }
            `);

          }


          labelCss.push(`
            .league-${index} {

              animation:
                league-label-${index}
                ${duration}s
                linear
                infinite;

            }
          `);


          gameOffset +=
            group.games.length;
        }
      );


      /*
       * ========================================================
       * OUTPUT
       * ========================================================
       */

      return `

        <style>
          ${labelCss.join("\n")}
        </style>


        <div
          class="ticker-shell"
          style="
            --ticker-duration:
              ${duration}s;
          "
        >


          <div class="league-label">

            ${labelHtml.join("")}

          </div>


          <div class="ticker-window">

            <div class="ticker-glow">
            </div>


            <div class="ticker-track">


              <div class="ticker-set">
                ${allGames}
              </div>


              <div
                class="ticker-set"
                aria-hidden="true"
              >
                ${allGames}
              </div>


            </div>

          </div>

        </div>
      `;
    ]]]
card_mod:
  style: |

    /*
     * ==========================================================
     * GLASS SHELL
     * ==========================================================
     */

    .ticker-shell {
      position: relative;

      width: 100%;
      height: 62px;

      display: grid;

      grid-template-columns:
        112px
        minmax(0,1fr);

      overflow: hidden;

      box-sizing: border-box;

      color:
        rgba(255,255,255,.96);

      background:
        linear-gradient(
          135deg,
          rgba(16,24,38,.74),
          rgba(8,17,31,.60)
        );

      backdrop-filter:
        blur(22px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(22px)
        saturate(150%);

      font-family:
        var(
          --paper-font-body1_-_font-family
        );
    }


    .ticker-shell::before {
      content: "";

      position: absolute;

      z-index: 1;

      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.11),
          rgba(255,255,255,.025) 45%,
          rgba(255,255,255,.01)
        );
    }


    .ticker-shell::after {
      content: "";

      position: absolute;

      z-index: 50;

      inset: 0;

      pointer-events: none;

      border:
        1px solid
        rgba(255,255,255,.09);

      box-sizing:
        border-box;
    }



    /*
     * ==========================================================
     * LEAGUE LABEL
     * ==========================================================
     */

    .league-label {
      position: relative;

      z-index: 20;

      width: 112px;
      height: 100%;

      overflow: hidden;

      border-right:
        1px solid
        rgba(255,255,255,.14);

      box-shadow:
        8px 0 20px
        rgba(0,0,0,.14);
    }


    .league-name {
      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      padding:
        0 12px;

      box-sizing:
        border-box;

      color:
        rgba(255,255,255,.99);

      background:
        linear-gradient(
          145deg,
          color-mix(
            in srgb,
            var(--league-accent)
            58%,
            transparent
          ),
          rgba(20,27,42,.64)
        );

      backdrop-filter:
        blur(22px)
        saturate(150%);

      -webkit-backdrop-filter:
        blur(22px)
        saturate(150%);

      white-space: nowrap;

      text-align: center;

      text-shadow:
        0 2px 4px
        rgba(0,0,0,.45);

      opacity: 0;

      visibility: hidden;
    }


    .league-name::before {
      content: "";

      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 3px;

      background:
        var(--league-accent);

      box-shadow:
        0 0 12px
        color-mix(
          in srgb,
          var(--league-accent)
          60%,
          transparent
        );
    }


    .league-name:first-child {
      opacity: 1;
      visibility: visible;
    }


    .league-text {
      position: relative;

      z-index: 2;

      line-height: 1;

      font-size: 19px;

      font-weight: 950;

      letter-spacing: 1px;
    }



    /*
     * ==========================================================
     * WINDOW
     * ==========================================================
     */

    .ticker-window {
      position: relative;

      z-index: 4;

      width: 100%;
      height: 100%;

      min-width: 0;

      overflow: hidden;
    }


    .ticker-glow {
      position: absolute;

      z-index: 0;

      top: -60px;
      left: 20%;

      width: 55%;
      height: 120px;

      pointer-events: none;

      border-radius: 50%;

      background:
        rgba(255,255,255,.045);

      filter:
        blur(28px);
    }



    /*
     * ==========================================================
     * SCROLL
     * ==========================================================
     */

    .ticker-track {
      position: absolute;

      z-index: 3;

      top: 0;
      left: 0;

      height: 100%;

      display: flex;

      align-items: stretch;

      width: max-content;

      animation:
        glass-sports-scroll
        var(--ticker-duration, 90s)
        linear
        infinite;

      will-change:
        transform;
    }


    @keyframes glass-sports-scroll {

      from {
        transform:
          translate3d(
            0,
            0,
            0
          );
      }

      to {
        transform:
          translate3d(
            -50%,
            0,
            0
          );
      }

    }


    .ticker-shell:hover
    .ticker-track,

    .ticker-shell:hover
    .league-name {
      animation-play-state:
        paused;
    }



    /*
     * ==========================================================
     * SET
     * ==========================================================
     */

    .ticker-set {
      height: 100%;

      display: flex;

      align-items: stretch;

      flex-shrink: 0;
    }



    /*
     * ==========================================================
     * GAME TILE
     *
     * 255px instead of 360px.
     * This removes most of the wasted horizontal space.
     * ==========================================================
     */

    .ticker-game {
      position: relative;

      width: 255px;
      min-width: 255px;
      max-width: 255px;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      padding:
        0 10px;

      box-sizing:
        border-box;

      white-space: nowrap;

      overflow: hidden;

      border-right:
        1px solid
        rgba(255,255,255,.10);

      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.012),
          rgba(255,255,255,.03),
          rgba(255,255,255,.012)
        );
    }



    /*
     * ==========================================================
     * LOGOS
     *
     * Slightly smaller plates give the matchup
     * more breathing room without hurting visibility.
     * ==========================================================
     */

    .team-logo-shell {
      width: 36px;
      height: 36px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex: 0 0 auto;

      padding: 4px;

      box-sizing: border-box;

      border-radius: 11px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.97),
          rgba(235,242,250,.84)
        );

      border:
        1px solid
        rgba(255,255,255,.88);

      box-shadow:

        0 3px 9px
        rgba(0,0,0,.16),

        inset
        0 1px 0
        rgba(255,255,255,1);
    }


    .team-logo {
      width: 27px;
      height: 27px;

      object-fit: contain;

      flex: 0 0 auto;

      filter:
        drop-shadow(
          0 1px 1px
          rgba(0,0,0,.13)
        );
    }


    .logo-fallback {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      color:
        #182132;

      font-size: 8px;

      font-weight: 950;
    }



    /*
     * ==========================================================
     * SCORE
     * ==========================================================
     */

    .score {
      color:
        rgba(255,255,255,.99);

      font-size: 17px;

      font-weight: 900;

      font-variant-numeric:
        tabular-nums;

      text-shadow:
        0 1px 3px
        rgba(0,0,0,.30);

      flex: 0 0 auto;
    }


    .score-separator {
      color:
        rgba(255,255,255,.25);

      font-size: 10px;

      flex: 0 0 auto;
    }


    .at {
      color:
        rgba(255,255,255,.50);

      font-size: 10px;

      font-weight: 900;

      flex: 0 0 auto;
    }



    /*
     * ==========================================================
     * UPCOMING
     * ==========================================================
     */

    .kickoff {
      margin-left: 3px;

      padding:
        4px 7px;

      border-radius:
        999px;

      color:
        rgba(235,244,255,.90);

      background:
        rgba(255,255,255,.08);

      border:
        1px solid
        rgba(255,255,255,.09);

      font-size: 9px;

      font-weight: 850;

      letter-spacing:
        .1px;

      flex: 0 0 auto;
    }



    /*
     * ==========================================================
     * LIVE
     * ==========================================================
     */

    .live-status {
      display: flex;

      align-items: center;

      gap: 3px;

      margin-left: 2px;

      padding:
        4px 6px;

      border-radius:
        999px;

      color:
        #ffb1b8;

      background:
        rgba(255,49,69,.11);

      border:
        1px solid
        rgba(255,80,95,.18);

      font-size: 8px;

      font-weight: 900;

      letter-spacing:
        .1px;

      white-space: nowrap;

      flex:
        0 0 auto;
    }


    .status-detail {
      color:
        rgba(255,225,228,.84);

      white-space: nowrap;
    }


    .live-dot {
      width: 6px;
      height: 6px;

      flex: 0 0 auto;

      border-radius: 50%;

      background:
        #ff4052;

      box-shadow:
        0 0 7px
        rgba(255,55,75,.70);
    }



    /*
     * ==========================================================
     * SPECIAL ALERTS
     * ==========================================================
     */

    .special-alert {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 3px;

      margin-left: 2px;

      padding:
        4px 6px;

      border-radius:
        999px;

      font-size: 8px;

      font-weight: 950;

      letter-spacing:
        .15px;

      white-space: nowrap;

      flex:
        0 0 auto;

      max-width: 118px;

      overflow: hidden;

      text-overflow: ellipsis;

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);
    }


    .alert-icon {
      font-size: 8px;

      flex: 0 0 auto;
    }


    .special-alert.alert-elite {
      color:
        #f7e8ff;

      background:
        rgba(145,70,225,.20);

      border:
        1px solid
        rgba(190,120,255,.38);
    }


    .special-alert.alert-hot {
      color:
        #ffd8dc;

      background:
        rgba(255,55,80,.18);

      border:
        1px solid
        rgba(255,85,105,.35);
    }


    .special-alert.alert-watch {
      color:
        #d8efff;

      background:
        rgba(40,145,255,.17);

      border:
        1px solid
        rgba(80,165,255,.30);
    }



    /*
     * ==========================================================
     * FINAL
     * ==========================================================
     */

    .final-status {
      margin-left: 2px;

      padding:
        4px 6px;

      border-radius:
        999px;

      color:
        rgba(232,239,248,.64);

      background:
        rgba(255,255,255,.055);

      border:
        1px solid
        rgba(255,255,255,.07);

      font-size: 8px;

      font-weight: 850;

      white-space: nowrap;

      flex:
        0 0 auto;
    }



    /*
     * ==========================================================
     * FAVORITE
     * ==========================================================
     */

    .ticker-game.favorite {
      box-shadow:
        inset
        0 -2px 0
        rgba(255,210,80,.72);
    }


    .favorite-star {
      color:
        #ffd75e;

      font-size: 9px;

      flex: 0 0 auto;
    }



    /*
     * ==========================================================
     * EMPTY
     * ==========================================================
     */

    .ticker-message {
      display: flex;

      align-items: center;

      padding:
        0 18px;

      color:
        rgba(225,235,247,.65);

      font-size: 12px;

      font-weight: 700;
    }



    /*
     * ==========================================================
     * MOBILE
     * ==========================================================
     */

    @container (max-width: 600px) {

      .ticker-shell {
        height: 54px;

        grid-template-columns:
          86px
          minmax(0,1fr);
      }


      .league-label {
        width: 86px;
      }


      .league-name {
        padding:
          0 7px;
      }


      .league-text {
        font-size: 15px;
      }


      .ticker-game {
        width: 225px;
        min-width: 225px;
        max-width: 225px;

        gap: 5px;

        padding:
          0 8px;
      }


      .team-logo-shell {
        width: 32px;
        height: 32px;

        border-radius: 9px;
      }


      .team-logo {
        width: 24px;
        height: 24px;
      }


      .score {
        font-size: 15px;
      }


      .kickoff,
      .live-status,
      .final-status {
        font-size: 7px;

        padding:
          3px 5px;
      }


      .special-alert {
        max-width: 100px;

        font-size: 7px;

        padding:
          3px 5px;
      }

    }
