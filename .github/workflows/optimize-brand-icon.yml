name: Optimize Sports Ticker brand icon

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-brand-icon.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Optimize brand icon
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          brand = Path('custom_components/sports_ticker/brand')
          src = brand / 'icon.png'

          with Image.open(src) as im:
              im = im.convert('RGBA')

              def make_square(size: int, target: Path) -> None:
                  fitted = ImageOps.contain(im, (size, size), Image.Resampling.LANCZOS)
                  canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
                  x = (size - fitted.width) // 2
                  y = (size - fitted.height) // 2
                  canvas.alpha_composite(fitted, (x, y))
                  canvas.save(target, format='PNG', optimize=True, compress_level=9)

              make_square(256, brand / 'icon.png')
              make_square(512, brand / 'icon@2x.png')

          print('icon.png:', (brand / 'icon.png').stat().st_size, 'bytes')
          print('icon@2x.png:', (brand / 'icon@2x.png').stat().st_size, 'bytes')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/optimize-brand-icon.yml

      - name: Commit optimized branding
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/sports_ticker/brand/icon.png custom_components/sports_ticker/brand/icon@2x.png .github/workflows/optimize-brand-icon.yml
          git commit -m "Optimize Sports Ticker brand icon"
          git push
